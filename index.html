

<!-- Again, I need to learn to stick to a case convention. Common for html are kebab-case and camelCase. snake_case is rarely used -->

<!DOCTYPE html>
<html>
<head>
    <title>Random Dungeon Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Random Dungeon Generator</h1>
    <p>Welcome to my dungeon generator!</p>
    <p>This is a simple random dungeon generator to help streamline RPG dungeon making.</p>
    <h2>Dungeon Settings</h2>
    <p>Choose your dungeon settings below:</p>

    <div class="settingsContainer">

        <div>
            <label for="dungeonName">Dungeon Name:</label>
            <input type="text" id="dungeonName" placeholder="Enter Dungeon Name">
        </div>
    
        <div>
            <label for="roomNumber">Number of Rooms:</label>
             <input 
                type="number" 
                id="roomNumber" 
                min="1" 
                max="20" 
                oninput="limitRange(this)" 
                placeholder="#"
            >
        </div>
        <div>
            <label for="difficulty">Difficulty Level:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="normal">Normal</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        <div>
            <label for="maxMonsters">Maximum Monsters per Room:</label>
            <input 
                type="number" 
                id="maxMonsters" 
                min="1" 
                max="100"
                oninput="limitRange(this)" 
                placeholder="#"
                >
        </div>
    
        <div>
            <label for="minMonsters">Minimum Monsters per Room:</label>
            <input 
                type="number" 
                id="minMonsters" 
                min="1" 
                max="100" 
                oninput="limitRange(this)" 
                placeholder="#"
            >
        </div>
        <div>
            <label for="monsterType">Monster Types:</label>
            <input type="text" id="monsterType" placeholder="Add a monster type, press Enter">
             <div class= "typeButton" id="monsterList"></div>
            <button id="monsterClear">Clear</button>
        </div>
        <div>
            <label for="maxTreasures">Maximum Treasure per Room:</label>
            <input 
                type="number" 
                id="maxTreasures" 
                min="1" max="10" 
                oninput="limitRange(this)" 
                placeholder="#"
            >
        </div>
        <div>
            <label for="minTreasures">Minimum Treasure per Room:</label>
            <input 
                type="number" 
                id="minTreasures" 
                min="1" max="10" 
                oninput="limitRange(this)" 
                placeholder="#"
            >
        </div>
        <div>
            <label for="treasureType">Treasure Types:</label>
            <input type="text" id="treasureType" placeholder="Add a treasure type, press Enter">
            <div class= "typeButton" id="treasureList"></div>
            <button id="treasureClear">Clear</button>
        </div>
        <div>
            <button id="generateButton">Generate Dungeon</button>
        </div>
    </div>
</div>
    <div>
        <script src="Website guts.js"></script>
                 
    </div>     
    <div id="dungeon_results" style="white-space: pre-line;"></div>

    
</body>
</html>
