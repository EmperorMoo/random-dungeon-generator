<!DOCTYPE html>
<html>
<head>
    <title>Random Dungeon Generator</title>
</head>
<body>
    <h1>Random Dungeon Generator</h1>
    <p>Welcome to my dungeon generator!</p>
    <p>This is a simple random dungeon generator to help streamline RPG dungeon making.</p>
    <h2>Dungeon Settings</h2>
    <p>Choose your dungeon settings below:</p>
    <div>
        <label for="dungeon_name">Dungeon Name:</label>
        <input type="text" id="dungeon_name" placeholder="Enter Dungeon Name">
    </div>
    <div>
        <label for="room_number">Number of Rooms:</label>
        <input type="number" id="room_number" min="1" max="20" placeholder="#">
    </div>
    <div>
        <label for="difficulty">Difficulty Level:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="normal">Normal</option>
            <option value="hard">Hard</option>
        </select>
    </div>
    <div>
        <label for="monster_type">Monster Type:</label>
        <input type="text" id="monster_type" placeholder="Enter Monster Type">
    </div>
    <div>
        <label for="max_monsters">Maximum Monsters per Room:</label>
        <input type="number" id="max_monsters" min="1" max="100" placeholder="#">
    </div>
    
    <div>
        <label for="min_monsters">Minimum Monsters per Room:</label>
        <input type="number" id="min_monsters" min="1" max="100" placeholder="#">
    </div>
    <div>
        <label for="treasure_type">Treasure Type:</label>
        <input type="text" id="treasure_type" placeholder="Enter Treasure Type">
    </div>
        <label for="max_treasure">Maximum Treasure per Room:</label>
        <input type="number" id="max_treasure" min="1" max="10" placeholder="#">
    </div>
    <div>
        <label for="min_treasure">Minimum Treasure per Room:</label>
        <input type="number" id="min_treasure" min="1" max="10" placeholder="#">
    </div>
    <div>
        <button id="generate_button">Generate Dungeon</button>
    </div>
    </body>
</body>
</html>
